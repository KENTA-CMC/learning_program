[project]
name = "pdf-link-highlighter"
version = "0.1.0"
description = "Automatically highlight link areas in PDF files"
authors = [
    {name = "Claude Code", email = "noreply@anthropic.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.23.0",
    "streamlit>=1.28.0",
    "pdf2image>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
highlight-links = "highlight_links:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
